[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "whisper-tm"
version = "0.9.0"
description = "Self-hosted transcription server built on WhisperX — GPU-accelerated, NAS-scale"
readme = "README.md"
license = "MIT AND Apache-2.0"
license-files = [
    "LICENSE",
    "THIRD_PARTY_NOTICES.md",
    "whisper_tm/vendor/redimnet/LICENSE",
    "whisper_tm/vendor/redimnet/LICENSE-APACHE-2.0",
]
# whisperx: below 3.14
requires-python = ">=3.11,<3.14"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: GPU :: NVIDIA CUDA",
    "Environment :: Web Environment",
    "Framework :: Flask",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "flask>=3.0",
    "pyyaml>=6.0",
    "platformdirs>=4.0",
    "psutil>=5.9",
    "requests>=2.28",
    # 18 modules import it at start (the API's first import); it came only
    # through whisperx so far
    "numpy>=1.24",
]

[project.urls]
Homepage = "https://github.com/lexusmexus961/whisper-transcription-manager"
Repository = "https://github.com/lexusmexus961/whisper-transcription-manager"
Issues = "https://github.com/lexusmexus961/whisper-transcription-manager/issues"
Changelog = "https://github.com/lexusmexus961/whisper-transcription-manager/blob/main/CHANGELOG.md"

[project.optional-dependencies]
# audio-separator[cpu] on NVIDIA too: its Roformer models run on PyTorch, and
# onnxruntime-gpu (its [gpu]) is built for CUDA 13 — without CUDA 13 libraries
# its import fails, and pyannote's with it (requirements-nvidia.txt)
gpu-nvidia = ["torch", "whisperx", "audio-separator[cpu]", "audioread", "yt-dlp"]
# AMD: PyTorch's ROCm build comes from its own index (setup.sh --gpu amd);
# torch-directml is left out — it pins an old torch that breaks whisperx, and
# WhisperX has no DirectML backend anyway
gpu-amd = ["torch", "whisperx", "audio-separator[cpu]", "audioread", "yt-dlp"]
cpu = ["torch", "whisperx", "audio-separator[cpu]", "audioread", "yt-dlp"]
# MCP server (whisper_tm/mcp_server.py) and Ask, the app's chat, which
# runs it in-process. The setup scripts install it (with beartype pinned by
# requirements-lock-overrides.txt: fastmcp's token stores, unused here, ask
# for a beartype audio-separator refuses).
mcp = ["fastmcp>=2.0"]
# The assignment's linking is compiled with numba (core/speaker_linkage.py);
# whisperx brings numba along. fastcluster only speeds up the fallback that
# runs without numba — which needs memory ~ centroids², tens of GB.
fast = ["numba>=0.58", "fastcluster>=1.2"]
# ruff pinned like the CI's: a new release brings new rules
dev = ["pytest", "pytest-cov", "ruff==0.15.21", "mypy"]

[project.scripts]
whisper-tm = "whisper_tm.__main__:run"

[tool.setuptools.packages.find]
where = ["."]
include = ["whisper_tm*"]

[tool.ruff]
line-length = 100
target-version = "py311"
# Third-party code kept as it came (THIRD_PARTY_NOTICES.md)
extend-exclude = ["whisper_tm/vendor"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]
ignore = [
    "N803", "N806",  # matrix names (A, S, X) follow the maths, not PEP 8
    "N818",          # exception names are part of the public error surface
    "B905",          # zip() over equal-length sequences by construction
    "SIM102",        # nested ifs often carry a comment per condition
    "SIM105",        # try/except/pass reads plainer than contextlib.suppress
    "SIM108",        # a ternary is not always clearer than if/else
    "SIM113",        # manual counters where the loop also skips entries
    "SIM117",        # nested with-blocks keep "raises" visibly outermost
    "SIM118",        # .keys() on sqlite3.Row is required, `in row` checks values
    "SIM300",        # comparisons keep the variable on the left
    "SIM905",        # a split() word list is easier to read than a list literal
]

[tool.ruff.lint.per-file-ignores]
# Tests: names stress the one word that matters (test_stop_KEEPS_the_queue),
# embedded JS/HTML fixtures run long, and some imports follow importorskip.
"tests/**" = ["E501", "E702", "E402", "N802", "B007", "B017", "UP031"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --tb=short --strict-markers"
# A test still running after five minutes hangs: every thread's stack goes
# to the output (the CI job's timeout ends the run later), instead of a
# run that stops without a word
faulthandler_timeout = 300
