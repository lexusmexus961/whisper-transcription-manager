name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read the code, nothing else: the jobs neither push nor comment
permissions:
  contents: read

# A newer push of the same branch cancels the run it makes outdated
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # setup.sh takes Python 3.11 to 3.13: the oldest, the recommended and the
    # newest of them — one failing doesn't cancel the others
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # The page's JavaScript is tested in node (tests/js/, the browser
      # extension): without it those tests skip, and the run is green anyway
      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      # The pipeline shells out to ffmpeg; several tests exercise that path.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      # The CPU requirements are what the project documents for a machine
      # without an NVIDIA card — the same set the test suite needs.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --extra-index-url https://download.pytorch.org/whl/cpu \
                      -r requirements-cpu.txt
          # .[mcp]: the MCP server's tests need fastmcp; beartype then back to
          # the version the app is tested with (see the file)
          pip install -c constraints.txt -e ".[dev,mcp]"
          pip install -c constraints.txt -r requirements-lock-overrides.txt

      # What was installed, so a failure from an upstream release can be
      # compared with requirements-lock-nvidia.txt
      - name: Versions
        run: |
          pip freeze
          python -c "import sqlite3; print('sqlite', sqlite3.sqlite_version)"
          ffmpeg -version | head -1
          node --version

      # A module that can't be imported turns its tests into skips and the
      # run stays green — here it fails the job instead
      - name: The libraries the tests need import
        run: python -c "import fastmcp, numba, pandas, torch, whisperx; print('ok')"

      # -rs names every skipped test and why; --durations the slowest. No test
      # may download a model: offline, a new one that tries fails fast.
      - name: Run tests
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
        run: pytest -q -rs --durations=25

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # Pinned (as in pyproject's dev extra and setup.sh --dev): a new ruff
      # release brings new rules, and the check would turn red without a
      # line of the project changing
      - run: pip install ruff==0.15.21
      # The full rule set from pyproject.toml — the codebase satisfies it.
      - run: ruff check .
      # The tree is formatted with ruff format (once, before the release)
      - run: ruff format --check .
